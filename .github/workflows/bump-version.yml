name: Bump Version
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump-version:
    name: Auto Bump SemVer Tag
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine next version from version.yaml
        id: bump
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type || 'patch' }}
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(awk -F ': ' '/^version:/ {print $2}' version.yaml | tr -d '"')"
          if [[ -z "${CURRENT_VERSION}" ]]; then
            echo "Could not read 'version' from version.yaml"
            exit 1
          fi

          if [[ ! "${CURRENT_VERSION}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "version.yaml version is not valid semver (major.minor.patch): ${CURRENT_VERSION}"
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"

          case "${BUMP_TYPE}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
            *)
              echo "Invalid bump type: ${BUMP_TYPE}"
              exit 1
              ;;
          esac

          NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEXT_TAG="v${NEXT_VERSION}"

          echo "current_version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "next_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "next_tag=${NEXT_TAG}" >> "$GITHUB_OUTPUT"

      - name: Update version.yaml version
        run: |
          set -euo pipefail
          sed -Ei "s/^version: .*/version: ${{ steps.bump.outputs.next_version }}/" version.yaml

      - name: Commit version.yaml update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "noreply@github.com"
          git add version.yaml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.next_version }}"
          git push origin HEAD

      - name: Create and push new tag
        run: |
          set -euo pipefail
          if git rev-parse "${{ steps.bump.outputs.next_tag }}" >/dev/null 2>&1; then
            echo "Tag already exists: ${{ steps.bump.outputs.next_tag }}"
            exit 1
          fi
          git tag "${{ steps.bump.outputs.next_tag }}"
          git push origin "${{ steps.bump.outputs.next_tag }}"
