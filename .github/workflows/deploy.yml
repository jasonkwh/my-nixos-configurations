name: Deploy NixOS Configuration

on:
  workflow_dispatch:
    inputs:
      machine:
        description: "Target machine"
        required: true
        default: "jasonkwh-7520u"
        type: choice
        options:
          - jasonkwh-7520u
          - jasonkwh-7300u

jobs:
  deploy:
    runs-on: [self-hosted, "${{ github.event.inputs.machine }}"]
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy NixOS configuration
        run: |
          echo "🚀 Deploying to ${{ github.event.inputs.machine }}..."
          /run/current-system/sw/bin/systemctl start nixos-rebuild-switch.service
          echo "✅ Rebuild triggered, waiting for completion..."
          while systemctl is-active nixos-rebuild-switch.service > /dev/null 2>&1; do
            sleep 5
            echo "⏳ Still building..."
          done
          if systemctl is-failed nixos-rebuild-switch.service > /dev/null 2>&1; then
            echo "❌ Build failed!"
            journalctl -u nixos-rebuild-switch.service --no-pager -n 100
            exit 1
          fi
          echo "✅ Rebuild completed successfully!"
