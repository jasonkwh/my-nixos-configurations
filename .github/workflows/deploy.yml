name: Deploy NixOS Configuration

on:
  workflow_dispatch:
    inputs:
      machine:
        description: "Target machine"
        required: true
        default: "jasonkwh-7520u"
        type: choice
        options:
          - jasonkwh-7520u
          - jasonkwh-7300u

jobs:
  deploy:
    runs-on: [self-hosted, "${{ github.event.inputs.machine }}"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy NixOS configuration
        run: |
          echo "🚀 Deploying to ${{ github.event.inputs.machine }}..."
          /run/current-system/sw/bin/nixos-rebuild switch --flake .#${{ github.event.inputs.machine }} --impure --upgrade-all
