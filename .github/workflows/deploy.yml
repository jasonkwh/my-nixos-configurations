name: Deploy NixOS Configuration

on:
  workflow_dispatch:
    inputs:
      machine:
        description: "Target machine"
        required: true
        default: "jasonkwh-7520u"
        type: choice
        options:
          - jasonkwh-7520u
          - jasonkwh-7300u
      k3s_role:
        description: "K3S role"
        required: true
        default: "server"
        type: choice
        options:
          - server
          - agent

jobs:
  deploy:
    runs-on: [self-hosted, "${{ github.event.inputs.machine }}"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write K3S token for agent nodes
        if: github.event.inputs.k3s_role == 'agent'
        run: |
          echo "🔑 Writing k3s token for agent node..."
          echo "${{ secrets.K3S_TOKEN }}" | sudo tee /var/lib/k3s-token > /dev/null
          sudo chmod 600 /var/lib/k3s-token
          echo "✅ K3s token written to /var/lib/k3s-token"

      - name: Deploy NixOS configuration
        run: |
          echo "🚀 Deploying to ${{ github.event.inputs.machine }}..."
          /run/current-system/sw/bin/systemctl start nixos-rebuild-switch.service
          echo "✅ Rebuild triggered, waiting for completion..."
          while systemctl is-active nixos-rebuild-switch.service > /dev/null 2>&1; do
            sleep 5
            echo "⏳ Still building..."
          done
          if systemctl is-failed nixos-rebuild-switch.service > /dev/null 2>&1; then
            echo "❌ Build failed!"
            journalctl -u nixos-rebuild-switch.service --no-pager -n 100
            exit 1
          fi
          echo "✅ Rebuild completed successfully!"

      - name: Update K3S token secret
        if: github.event.inputs.k3s_role == 'server'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔑 Reading k3s token from server..."
          if [ -f /var/lib/rancher/k3s/server/node-token ]; then
            K3S_TOKEN=$(sudo cat /var/lib/rancher/k3s/server/node-token)
            echo "📝 Updating GitHub secret K3S_TOKEN..."
            echo "$K3S_TOKEN" | gh secret set K3S_TOKEN --repo ${{ github.repository }}
            echo "✅ K3S_TOKEN secret updated successfully!"
          else
            echo "⚠️ K3s token file not found, skipping secret update"
          fi
