name: Evaluate hosts

on:
  push:
    branches:
      - main
    paths-ignore:
      - version.yaml
  pull_request:
  workflow_dispatch:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    name: NixOS + Home Manager eval
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true

      # One runner, one fetch of github: inputs (hermes-agent, etc.). A per-host
      # matrix hit GitHub tarball API in parallel and got HTTP 429.
      - name: Prefetch flake inputs
        run: nix flake prefetch .

      - name: Eval host configurations
        run: |
          set -euo pipefail
          nixos_hosts=(
            jasonkwh-7300u
            jasonkwh-7520u
            jasonkwh-2450m
            jasonkwh-3210m
            jasonkwh-bcm2711
          )
          for host in "${nixos_hosts[@]}"; do
            attr="nixosConfigurations.${host}.config.system.build.toplevel"
            drvPath="$(nix eval --raw ".#${attr}.drvPath")"
            printf '%s eval ok -> %s\n' "$host" "$drvPath"
          done
          deck_drv="$(nix eval --raw '.#homeConfigurations.jasonkwh-deck.activationPackage.drvPath')"
          printf 'jasonkwh-deck eval ok -> %s\n' "$deck_drv"
